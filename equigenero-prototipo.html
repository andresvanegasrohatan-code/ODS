<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4fa">
  <meta name="description" content="Prototipo local EquiGénero para promover la igualdad y registrar situaciones.">
  <title>EquiGénero — Prototipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #282238;
      --muted: #81788e;
      --line: #eee8f0;
      --canvas: #faf8fb;
      --surface: #fff;
      --plum: #392448;
      --plum-soft: #f1e9f5;
      --pink: #faedf3;
      --pink-strong: #e9c6d7;
      --magenta: #a21c5a;
      --magenta-dark: #861449;
      --lavender: #eeeafb;
      --lavender-ink: #6353a5;
      --mint: #e8f5ef;
      --mint-ink: #31785e;
      --gold: #fbf2df;
      --gold-ink: #9a6b16;
      --red: #fcebed;
      --red-ink: #b34450;
      --shadow: 0 14px 42px rgba(51, 31, 62, .07);
      --shadow-soft: 0 5px 18px rgba(51, 31, 62, .055);
      --radius: 22px;
      --radius-small: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.6 "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .serif { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -.04em; }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, .88fr) minmax(420px, 1.12fr);
      background: var(--surface);
    }
    .auth-aside {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 42px clamp(28px, 5vw, 76px);
      color: #fff;
      background:
        radial-gradient(ellipse at 16% 90%, rgba(241, 180, 207, .2), transparent 38%),
        radial-gradient(ellipse at 95% 10%, rgba(193, 168, 223, .19), transparent 35%),
        linear-gradient(145deg, #30213e 0%, #40274c 54%, #632b55 100%);
    }
    .auth-aside::before, .auth-aside::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      pointer-events: none;
    }
    .auth-aside::before { width: 410px; height: 410px; right: -190px; bottom: -125px; }
    .auth-aside::after { width: 290px; height: 290px; right: -130px; bottom: -65px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font: 800 20px "Plus Jakarta Sans", sans-serif; letter-spacing: -.045em; }
    .brand-mark {
      display: grid; place-items: center; width: 39px; height: 39px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 13px;
      background: rgba(255,255,255,.12); font-size: 19px;
    }
    .aside-copy { position: relative; z-index: 1; max-width: 440px; margin: auto 0; padding: 66px 0; }
    .eyebrow { margin: 0 0 15px; text-transform: uppercase; letter-spacing: .13em; font-size: 11px; font-weight: 700; opacity: .75; }
    .aside-copy h1 { margin: 0; font: 700 clamp(38px, 5vw, 62px)/1.08 "Plus Jakarta Sans", sans-serif; letter-spacing: -.065em; }
    .aside-copy p { max-width: 370px; margin: 22px 0 0; color: rgba(255,255,255,.76); font-size: 16px; line-height: 1.8; }
    .aside-values { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 27px; }
    .aside-values span { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid rgba(255,255,255,.17); border-radius: 999px; color: rgba(255,255,255,.88); background: rgba(255,255,255,.09); backdrop-filter: blur(8px); font-size: 11px; font-weight: 600; }
    .aside-values span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f49dc4; box-shadow: 0 0 12px rgba(244,157,196,.7); }
    .aside-values span:nth-child(2)::before { background: #c5a8f4; box-shadow: 0 0 12px rgba(197,168,244,.7); }
    .aside-values span:nth-child(3)::before { background: #95ddc1; box-shadow: 0 0 12px rgba(149,221,193,.7); }
    .aside-note { position: relative; z-index: 1; color: rgba(255,255,255,.58); font-size: 12px; }

    .auth-main { display: grid; place-items: center; padding: 42px 24px; }
    .auth-card { width: min(100%, 430px); }
    .auth-mobile-brand { display: none; }
    .auth-card h2 { margin: 0; font: 700 31px/1.25 "Plus Jakarta Sans", sans-serif; letter-spacing: -.05em; }
    .auth-intro { margin: 10px 0 28px; color: var(--muted); }
    .auth-tabs { display: flex; gap: 7px; padding: 5px; margin: 0 0 24px; border-radius: 14px; background: #f6f2f7; }
    .auth-tab {
      flex: 1; border: 0; border-radius: 10px; padding: 10px 12px;
      color: var(--muted); background: transparent; font-weight: 700; transition: .2s ease;
    }
    .auth-tab.active { color: var(--magenta); background: #fff; box-shadow: 0 2px 8px rgba(45,25,54,.08); }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field label, .field-label { color: #4c4358; font-size: 13px; font-weight: 700; }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid #e8e1eb; border-radius: 12px; outline: 0;
      padding: 12px 14px; color: var(--ink); background: #fff;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .field textarea { min-height: 128px; resize: vertical; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 70px; }
    .password-toggle { position: absolute; top: 50%; right: 7px; transform: translateY(-50%); border: 0; border-radius: 8px; padding: 6px 8px; color: #8b6682; background: transparent; font-size: 11px; font-weight: 700; }
    .password-toggle:hover { color: var(--magenta); background: #fbf0f6; }
    .password-toggle:focus-visible { outline: 2px solid rgba(162,28,90,.35); outline-offset: 1px; }
    .field input::placeholder, .field textarea::placeholder { color: #b5adbd; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: #c45a89; box-shadow: 0 0 0 4px rgba(162,28,90,.09); background: #fff;
    }
    .helper { margin: -7px 0 17px; color: var(--muted); font-size: 12px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 43px; border: 1px solid transparent; border-radius: 12px;
      padding: 10px 16px; color: var(--ink); background: #fff; font-weight: 700;
      text-decoration: none; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
    .button:focus-visible, .nav-button:focus-visible, .auth-tab:focus-visible { outline: 3px solid rgba(162,28,90,.28); outline-offset: 2px; }
    .button-primary { color: #fff; background: var(--magenta); box-shadow: 0 6px 15px rgba(162,28,90,.18); }
    .button-primary:hover { background: var(--magenta-dark); }
    .button-outline { border-color: #e8dce9; color: var(--magenta); background: transparent; }
    .button-quiet { color: #72677d; background: transparent; }
    .button-small { min-height: 34px; padding: 6px 10px; border-radius: 10px; font-size: 12px; }
    .button-block { width: 100%; min-height: 48px; margin-top: 4px; }
    .demo-box { display: flex; gap: 11px; margin-top: 24px; padding: 14px; border: 1px solid #f0e7ef; border-radius: 13px; background: #fcf8fb; color: var(--muted); font-size: 12px; }
    .demo-box strong { color: var(--ink); }
    .auth-local-note { display: flex; gap: 10px; margin-top: 21px; padding: 12px 13px; border: 1px solid #eee5f0; border-radius: 12px; color: #82778a; background: linear-gradient(110deg, #fff8fb, #f7f5fc); font-size: 11px; line-height: 1.55; }
    .auth-local-note > span:first-child { flex: none; color: #9a4e89; font-size: 15px; }
    .auth-local-note > span:last-child { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .strength-meter { display: grid; gap: 6px; margin: -8px 0 15px; }
    .strength-bars { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; }
    .strength-bars span { height: 4px; border-radius: 9px; background: #eee9f0; transition: background .18s ease; }
    .strength-meter[data-level="1"] .strength-bars span:nth-child(-n+1) { background: #d84e68; }
    .strength-meter[data-level="2"] .strength-bars span:nth-child(-n+2) { background: #e6a63d; }
    .strength-meter[data-level="3"] .strength-bars span:nth-child(-n+3) { background: #8c71be; }
    .strength-meter[data-level="4"] .strength-bars span { background: #469879; }
    .strength-caption { color: #897f90; font-size: 10px; }
    .strength-meter[data-level="1"] .strength-caption { color: #b33c54; }
    .strength-meter[data-level="2"] .strength-caption { color: #9a6b16; }
    .strength-meter[data-level="3"] .strength-caption { color: #70569f; }
    .strength-meter[data-level="4"] .strength-caption { color: #34785e; }

    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed; z-index: 5; inset: 0 auto 0 0; display: flex; flex-direction: column;
      width: 252px; padding: 25px 17px 18px; color: #fff;
      background: linear-gradient(180deg, #30213e, #382344);
    }
    .sidebar .brand { padding: 0 10px 31px; }
    .nav-label { padding: 0 11px; margin: 0 0 8px; color: rgba(255,255,255,.43); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-button {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px;
      border: 0; border-radius: 12px; color: rgba(255,255,255,.69);
      background: transparent; text-align: left; font-weight: 600; transition: .2s ease;
    }
    .nav-button:hover { color: #fff; background: rgba(255,255,255,.08); }
    .nav-button.active { color: #fff; background: linear-gradient(100deg, #a21c5a, #852552); box-shadow: 0 6px 16px rgba(19,10,28,.2); }
    .nav-icon { display: grid; place-items: center; width: 22px; font-size: 17px; }
    .sidebar-bottom { margin-top: auto; }
    .sidebar-tip { margin: 15px 3px; padding: 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(255,255,255,.055); }
    .sidebar-tip strong { display: block; margin-bottom: 4px; color: #fff; font-size: 12px; }
    .sidebar-tip span { color: rgba(255,255,255,.57); font-size: 11px; }
    .user-mini { display: flex; align-items: center; gap: 10px; padding: 15px 7px 0; border-top: 1px solid rgba(255,255,255,.11); }
    .avatar { display: grid; flex: none; place-items: center; width: 37px; height: 37px; border-radius: 50%; color: var(--magenta); background: #f7dfe9; font-weight: 800; }
    .user-mini-copy { min-width: 0; flex: 1; }
    .user-mini-copy strong { display: block; overflow: hidden; color: #fff; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .user-mini-copy span { color: rgba(255,255,255,.52); font-size: 11px; }
    .logout-button { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 10px; color: rgba(255,255,255,.7); background: transparent; font-size: 17px; }
    .logout-button:hover { color: #fff; background: rgba(255,255,255,.1); }

    .main-area { min-height: 100vh; margin-left: 252px; }
    .topbar {
      position: sticky; z-index: 4; top: 0; display: flex; align-items: center; justify-content: space-between;
      min-height: 70px; padding: 0 clamp(23px, 4.1vw, 58px); border-bottom: 1px solid rgba(235,228,238,.85);
      background: rgba(255,255,255,.86); backdrop-filter: blur(14px);
    }
    .topbar-kicker { color: #8d8297; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; gap: 11px; color: #756b80; font-size: 13px; }
    .main-content { width: min(100%, 1250px); margin: 0 auto; padding: 36px clamp(23px, 4.1vw, 58px) 56px; }
    .mobile-menu { display: none; border: 0; padding: 8px; color: var(--ink); background: transparent; font-size: 21px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    .page-heading h1 { margin: 0; font: 700 clamp(26px, 3vw, 35px)/1.2 "Plus Jakarta Sans", sans-serif; letter-spacing: -.055em; }
    .page-heading p { margin: 8px 0 0; color: var(--muted); }
    .heading-actions { display: flex; gap: 9px; }
    .card {
      border: 1px solid #efe8f0; border-radius: var(--radius); background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .welcome-card {
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
      gap: 25px; min-height: 185px; padding: 31px clamp(24px, 4vw, 43px);
      border: 1px solid #eedce8; border-radius: var(--radius);
      background: linear-gradient(112deg, #fff 0%, #fff9fc 56%, #f5eff9 100%);
    }
    .welcome-card::after { content: "✿"; position: absolute; right: 34px; bottom: -50px; color: rgba(162,28,90,.09); font-size: 205px; line-height: 1; transform: rotate(-16deg); }
    .welcome-copy { position: relative; z-index: 1; max-width: 570px; }
    .welcome-copy .eyebrow { margin-bottom: 10px; color: var(--magenta); opacity: 1; }
    .welcome-copy h2 { margin: 0; font: 700 clamp(25px, 3vw, 34px)/1.2 "Plus Jakarta Sans", sans-serif; letter-spacing: -.05em; }
    .welcome-copy p { margin: 10px 0 18px; color: var(--muted); }
    .welcome-symbol { position: relative; z-index: 1; display: grid; flex: none; place-items: center; width: 97px; height: 97px; border: 1px solid #eedce8; border-radius: 27px; color: var(--magenta); background: rgba(255,255,255,.77); font-size: 42px; transform: rotate(4deg); }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 32px 0 15px; }
    .section-title h2 { margin: 0; font: 700 19px "Plus Jakarta Sans", sans-serif; letter-spacing: -.035em; }
    .section-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; }
    .stat-card { padding: 19px 20px; transition: transform .2s ease, box-shadow .2s ease; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .stat-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .stat-value { margin-top: 10px; font: 800 35px/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.06em; }
    .stat-note { margin-top: 7px; color: #9b92a3; font-size: 11px; }
    .stat-icon { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 13px; font-size: 19px; }
    .icon-pink { color: var(--magenta); background: var(--pink); }
    .icon-lavender { color: var(--lavender-ink); background: var(--lavender); }
    .icon-mint { color: var(--mint-ink); background: var(--mint); }
    .icon-gold { color: var(--gold-ink); background: var(--gold); }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr); gap: 17px; margin-top: 20px; }
    .panel { padding: 22px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 19px; }
    .panel-header h3 { margin: 0; font: 700 16px "Plus Jakarta Sans", sans-serif; letter-spacing: -.025em; }
    .panel-header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .quick-links { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .quick-link { display: flex; flex-direction: column; gap: 13px; min-height: 98px; padding: 14px; border: 1px solid #eee7f0; border-radius: 15px; color: var(--ink); background: #fff; text-align: left; transition: .2s ease; }
    .quick-link:hover { border-color: #e2c6d7; background: #fffbfd; transform: translateY(-2px); }
    .quick-link span:first-child { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 11px; color: var(--magenta); background: var(--pink); font-size: 17px; }
    .quick-link strong { font-size: 12px; }
    .list-stack { display: grid; gap: 10px; }
    .recent-item { display: flex; align-items: flex-start; gap: 11px; padding: 12px 0; border-bottom: 1px solid #f2edf3; }
    .recent-item:last-child { border-bottom: 0; }
    .recent-dot { flex: none; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--magenta); }
    .recent-copy { min-width: 0; flex: 1; }
    .recent-copy strong { display: block; font-size: 12px; }
    .recent-copy span { color: var(--muted); font-size: 11px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; width: fit-content; border-radius: 999px; padding: 5px 9px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge-pending { color: #8b6419; background: #fff4d8; }
    .badge-active { color: #a04470; background: #faeaf1; }
    .badge-resolved { color: #34745d; background: #e7f5ed; }
    .badge-low { color: #34745d; background: #e7f5ed; }
    .badge-medium { color: #8b6419; background: #fff4d8; }
    .badge-high { color: #ae4650; background: #fcebed; }
    .badge-admin { color: #6655a2; background: #efebfb; }

    .form-card { padding: clamp(20px, 3vw, 30px); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 17px; }
    .field-full { grid-column: 1 / -1; }
    .priority-options { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
    .priority-option { position: relative; }
    .priority-option input { position: absolute; opacity: 0; pointer-events: none; }
    .priority-option label { display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 43px; padding: 8px; border: 1px solid #ebe5ed; border-radius: 11px; color: #777080; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; transition: .18s ease; }
    .priority-option label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .priority-option.low label { color: #4c8b6d; }
    .priority-option.medium label { color: #aa7c23; }
    .priority-option.high label { color: #b44754; }
    .priority-option input:checked + label { border-color: currentColor; box-shadow: 0 0 0 3px rgba(162,28,90,.07); background: #fffafb; }
    .priority-option input:focus-visible + label { outline: 3px solid rgba(162,28,90,.22); outline-offset: 2px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 8px; }
    .inline-message { display: none; margin: 0 0 17px; padding: 11px 13px; border: 1px solid transparent; border-radius: 11px; font-size: 13px; }
    .inline-message.show { display: block; }
    .inline-message.error { color: #9e3540; border-color: #f4cfd3; background: #fff5f6; }
    .inline-message.success { color: #2d7158; border-color: #cce9d8; background: #f1faf5; }

    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .search-field { position: relative; flex: 1; max-width: 340px; }
    .search-field span { position: absolute; top: 10px; left: 12px; color: #94899b; }
    .search-field input { width: 100%; min-height: 41px; border: 1px solid #e9e2eb; border-radius: 11px; outline: 0; padding: 9px 12px 9px 36px; background: #fff; }
    .search-field input:focus { border-color: #c45a89; box-shadow: 0 0 0 3px rgba(162,28,90,.08); }
    .filter-select { min-height: 41px; border: 1px solid #e9e2eb; border-radius: 11px; padding: 8px 30px 8px 11px; color: #675d71; background: #fff; }
    .table-wrap { overflow: auto; border: 1px solid #efe9f0; border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 660px; }
    th, td { padding: 14px 15px; border-bottom: 1px solid #f1edf2; text-align: left; vertical-align: middle; }
    th { color: #92899a; background: #fcfafc; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    td { color: #51495d; font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fdfafd; }
    .table-main { color: var(--ink); font-weight: 700; }
    .table-sub { display: block; margin-top: 3px; color: #958b9b; font-size: 11px; }
    .empty-state { padding: 42px 18px; color: var(--muted); text-align: center; }
    .empty-state .empty-icon { display: block; margin-bottom: 10px; font-size: 31px; }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--ink); }
    .opportunity-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 15px; }
    .opportunity-card { display: flex; flex-direction: column; min-height: 225px; padding: 20px; transition: transform .2s ease, box-shadow .2s ease; }
    .opportunity-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .opportunity-card h3 { margin: 14px 0 7px; font: 700 16px/1.35 "Plus Jakarta Sans", sans-serif; letter-spacing: -.03em; }
    .opportunity-card p { margin: 0 0 15px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .opportunity-card .button { align-self: flex-start; margin-top: auto; }
    .event-list { display: grid; gap: 12px; }
    .event-item { display: flex; align-items: center; gap: 14px; padding: 15px; border: 1px solid #f0eaf1; border-radius: 14px; }

        password: "Admin12345!",
        role: "administrador"

      const initialOpportunities = [
        {

          color: "pink",
          title: "Línea 155 para orientación a mujeres",
          description: "Canal nacional de orientación sobre violencias basadas en género. Si hay una emergencia inmediata, llama al 123.",
          action: "Información oficial",

        {

          title: "Voluntariado en línea de Naciones Unidas",
          description: "Explora asignaciones de voluntariado en línea y encuentra iniciativas en las que participar.",
          action: "Explorar oportunidades",
          url: "https://app.unv.org/"
        },
        {
          tag: "Recurso permanente",
          color: "mint",
          title: "Igualdad de género · ODS 5",
          description: "Conoce metas y acciones globales para alcanzar la igualdad de género y empoderar a todas las mujeres y niñas.",
          action: "Consultar la ONU",
          url: "https://www.un.org/sustainabledevelopment/es/gender-equality/"
        }
      ];
      const events = [
        { day: "25", month: "NOV", title: "Día Internacional de la Eliminación de la Violencia contra la Mujer", detail: "Cada año · Campaña global de sensibilización" },
        { day: "08", month: "MAR", title: "Día Internacional de las Mujeres", detail: "Cada año · Participación, igualdad y derechos" },
        { day: "10", month: "DIC", title: "Día de los Derechos Humanos", detail: "Cada año · Cierre de los 16 días de activismo" }
      ];
      const categories = ["Acoso", "Discriminación educativa", "Desigualdad de oportunidades", "Violencia basada en género", "Otro"];
      const app = document.getElementById("app");
      const toastRegion = document.getElementById("toast-region");
      let authMode = "login";
      let currentPage = "dashboard";
      let searchTerm = "";
      let statusFilter = "all";

      function readStorage(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          console.error("No se pudo leer el almacenamiento local:", error);
          return fallback;
        }
      }
      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (error) {
          console.error("No se pudo guardar en el almacenamiento local:", error);
          showToast("No se pudo guardar. Revisa el espacio disponible del navegador.", "error");
          return false;
        }
      }
      function getUsers() {
        const users = readStorage(STORAGE.users, []);
        return Array.isArray(users) ? users : [];
      }
      function getReports() {
        const reports = readStorage(STORAGE.reports, []);
        return Array.isArray(reports) ? reports : [];
      }
      function getCurrentUser() {
        const session = readStorage(STORAGE.session, null);
        if (!session || typeof session !== "object" || !session.email) return null;
        if (session.id === adminDemo.id) return adminDemo;
        return getUsers().find((user) => user.id === session.id) || null;
      }
      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }
      function formatDate(dateValue) {
        if (!dateValue) return "Sin fecha";
        const date = new Date(`${dateValue}T12:00:00`);
        return new Intl.DateTimeFormat("es-CO", { day: "numeric", month: "short", year: "numeric" }).format(date);
      }

        if (authMode === "register") {
          const name = String(data.get("name") || "").trim();
          if (name.length < 2) {
            setInlineMessage(message, "Escribe tu nombre (al menos 2 caracteres).");
            form.elements.name.focus();
            return;
          }
          if (password.length < 8) {
            setInlineMessage(message, "La contraseña debe tener al menos 8 caracteres.");
            form.elements.password.focus();
            return;
          }
          if (email === adminDemo.email || getUsers().some((user) => user.email === email)) {
            setInlineMessage(message, "Ya existe una cuenta con ese correo. Inicia sesión.");
            form.elements.email.focus();
            return;
          }
          const user = { id: `user-${Date.now()}-${Math.random().toString(16).slice(2)}`, name, email, password, role: "usuario" };
          const users = getUsers();
          users.push(user);
          if (!writeStorage(STORAGE.users, users) || !writeStorage(STORAGE.session, { id: user.id, email: user.email })) return;
          currentPage = "dashboard";
          render();
          showToast("Tu cuenta se creó correctamente. ¡Bienvenida!");
          return;
        }
        const user = email === adminDemo.email ? adminDemo : getUsers().find((item) => item.email === email);
        if (!user || user.password !== password) {
          setInlineMessage(message, "El correo o la contraseña no coinciden.");
          form.elements.password.focus();
          return;
        }
        if (!writeStorage(STORAGE.session, { id: user.id, email: user.email })) return;
        currentPage = "dashboard";
        render();
        showToast(`Bienvenida${user.role === "administrador" ? ", administradora" : ""}.`);
      }
      function handleReportSubmit(form) {
        const message = document.getElementById("report-message");
        clearInlineMessage(message);
        const data = new FormData(form);
        const type = String(data.get("type") || "");
        const date = String(data.get("date") || "");
        const place = String(data.get("place") || "").trim();
        const priority = String(data.get("priority") || "");
        const description = String(data.get("description") || "").trim();
        const maxDate = new Date().toISOString().slice(0, 10);
        if (!categories.includes(type)) return setInlineMessage(message, "Selecciona un tipo de situación.");
        if (!date || date > maxDate) return setInlineMessage(message, "Selecciona una fecha válida que no sea futura.");
        if (place.length < 2) return setInlineMessage(message, "Escribe el lugar (al menos 2 caracteres).");
        if (!["Baja", "Media", "Alta"].includes(priority)) return setInlineMessage(message, "Selecciona el nivel de prioridad.");
        if (description.length < 15) return setInlineMessage(message, "Describe la situación con al menos 15 caracteres.");
        const user = getCurrentUser();
        const report = {
          id: `report-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          userId: user.id,
          author: user.name,
          type, date, place, priority, description,
          status: "Pendiente",
          createdAt: new Date().toISOString().slice(0, 10)
        };
        const reports = getReports();
        reports.push(report);
        if (!writeStorage(STORAGE.reports, reports)) return;
        currentPage = "reports-list";
        render();
        showToast("La situación quedó guardada en este navegador.");
      }
      function changeStatus(reportId, status) {
        if (!["Pendiente", "Activo", "Resuelto"].includes(status)) return;
        const reports = getReports();
        const report = reports.find((item) => item.id === reportId);
        if (!report) return;
        report.status = status;
        if (writeStorage(STORAGE.reports, reports)) {
          render();
          showToast("Estado actualizado.");
        }
      }
      function confirmAction(title, description) {
        return new Promise((resolve) => {
          const backdrop = document.createElement("div");
          backdrop.className = "confirm-backdrop";
          backdrop.innerHTML = `<section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-description" tabindex="-1"><h2 id="confirm-title">${escapeHtml(title)}</h2><p id="confirm-description">${escapeHtml(description)}</p><div class="confirm-actions"><button class="button button-outline" type="button" data-confirm="cancel">Cancelar</button><button class="button button-danger" type="button" data-confirm="accept">Eliminar</button></div></section>`;
          document.body.appendChild(backdrop);
          const dialog = backdrop.querySelector(".confirm-dialog");
          const cancel = backdrop.querySelector('[data-confirm="cancel"]');
          const accept = backdrop.querySelector('[data-confirm="accept"]');
          let finished = false;
          const finish = (result) => {
            if (finished) return;
            finished = true;
            document.removeEventListener("keydown", onKeyDown);
            backdrop.remove();
            resolve(result);
          };
          const onKeyDown = (event) => {
            if (event.key === "Escape") finish(false);
            if (event.key === "Tab") {
              event.preventDefault();
              (document.activeElement === cancel ? accept : cancel).focus();
            }
          };
          cancel.addEventListener("click", () => finish(false));
          accept.addEventListener("click", () => finish(true));
          backdrop.addEventListener("click", (event) => {
            if (event.target === backdrop) finish(false);
          });
          document.addEventListener("keydown", onKeyDown);
          cancel.focus();
        });
      }
      async function deleteReport(reportId) {
        if (getCurrentUser()?.role !== "administrador") return;
        const reports = getReports();
        if (!reports.some((report) => report.id === reportId)) return;
        const confirmed = await confirmAction("¿Eliminar este registro?", "Se quitará del almacenamiento de este navegador. Esta acción no se puede deshacer.");
        if (!confirmed) return;
        if (writeStorage(STORAGE.reports, reports.filter((report) => report.id !== reportId))) {
          render();
          showToast("Registro eliminado del prototipo.");
        }
      }
      function exportReports() {
        if (getCurrentUser()?.role !== "administrador") return;
        const rows = getReports();
        const headers = ["Tipo", "Fecha", "Lugar", "Prioridad", "Estado", "Persona", "Descripción"];
        const quote = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
        const csv = [headers, ...rows.map((report) => [report.type, report.date, report.place, report.priority, report.status, report.author, report.description])]
          .map((row) => row.map(quote).join(",")).join("\r\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "equigenero-prototipo-reportes.csv";
        link.click();
        URL.revokeObjectURL(url);
        showToast("Se descargó el archivo CSV.");
      }
      function navigate(page) {
        const user = getCurrentUser();
        if (!user) return;
        if (page === "reports" && user.role !== "administrador") {
          showToast("Los reportes generales son exclusivos de la administradora.", "error");
          return;
        }
        currentPage = page;
        mobileNavOpen = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.addEventListener("click", (event) => {
        const authTab = event.target.closest("[data-auth-mode]");
        if (authTab) return setAuthMode(authTab.dataset.authMode);
        const nav = event.target.closest("[data-page]");
        if (nav) {
          event.preventDefault();
          return navigate(nav.dataset.page);
        }
        const action = event.target.closest("[data-action]");
        if (action?.dataset.action === "logout") {
          localStorage.removeItem(STORAGE.session);
          currentPage = "dashboard";
          authMode = "login";
          mobileNavOpen = false;
          render();
          showToast("Cerraste la sesión de este prototipo.");
        }
        if (action?.dataset.action === "menu") {
          mobileNavOpen = !mobileNavOpen;
          render();
        }
        if (action?.dataset.action === "export") exportReports();
        if (action?.dataset.action === "toggle-password") {
          const input = document.getElementById(action.getAttribute("aria-controls"));
          const visible = input.type === "password";
          input.type = visible ? "text" : "password";
          action.textContent = visible ? "Ocultar" : "Mostrar";
          action.setAttribute("aria-pressed", String(visible));
        }
        const deleteButton = event.target.closest("[data-delete-report]");
        if (deleteButton) deleteReport(deleteButton.dataset.deleteReport);
        if (event.target.id === "mobile-overlay") {
          mobileNavOpen = false;
          render();
        }
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "auth-form") {
          event.preventDefault();
          handleAuthSubmit(event.target);
        }
        if (event.target.id === "report-form") {
          event.preventDefault();
          handleReportSubmit(event.target);
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "auth-password") updatePasswordStrength(event.target.value);
        if (event.target.id === "report-search") {
          const selection = event.target.selectionStart;
          searchTerm = event.target.value;
          render();
          const input = document.getElementById("report-search");
          input.focus();
          input.setSelectionRange(selection, selection);
        }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "status-filter") {
          statusFilter = event.target.value;
          render();
        }
        if (event.target.matches("[data-status-id]")) changeStatus(event.target.dataset.statusId, event.target.value);
      });

      render();
    })();
  </script>
</body>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama entidad-relación de EquiGénero</title>
  <desc id="desc">Modelo relacional MySQL con las entidades usuarios, situaciones y oportunidades. Un usuario puede registrar muchas situaciones; cada situación pertenece a un usuario. Oportunidades son independientes.</desc>
  <defs>
    <style>
      .bg { fill: #fbf7f8; }
      .title { font: 700 32px Arial, sans-serif; fill: #381c31; }
      .subtitle { font: 16px Arial, sans-serif; fill: #786574; }
      .entity { fill: #fff; stroke: #d8c2ce; stroke-width: 2; }
      .head-user { fill: #8e1b4d; }
      .head-case { fill: #5b4a8a; }
      .head-op { fill: #b8862b; }
      .head-text { font: 700 22px Arial, sans-serif; fill: #fff; }
      .field { font: 16px Arial, sans-serif; fill: #392e38; }
      .meta { font: 13px Arial, sans-serif; fill: #826f7c; }
      .line { stroke: #8e1b4d; stroke-width: 3; fill: none; }
      .cardinality { font: 700 17px Arial, sans-serif; fill: #6c1339; }
      .note { fill: #f5e8ef; stroke: #e4c9d7; stroke-width: 1.5; }
      .note-text { font: 15px Arial, sans-serif; fill: #58394b; }
    </style>
  </defs>
  <rect class="bg" width="1500" height="930" rx="22"/>
  <text class="title" x="70" y="72">EquiGénero · Diagrama entidad-relación</text>
  <text class="subtitle" x="70" y="104">Base relacional MySQL · Motor InnoDB · UTF-8 (utf8mb4)</text>

  <g transform="translate(75 170)">
    <rect class="entity" width="390" height="470" rx="16"/>
    <path class="head-user" d="M16 0h358a16 16 0 0 1 16 16v54H0V16A16 16 0 0 1 16 0z"/>
    <text class="head-text" x="26" y="43">USUARIOS</text>
    <text class="field" x="28" y="112">🔑  id INT</text><text class="meta" x="300" y="112">PK, AI</text>
    <text class="field" x="28" y="151">nombre VARCHAR(120)</text>
    <text class="field" x="28" y="190">correo VARCHAR(160)</text><text class="meta" x="300" y="190">UNIQUE</text>
    <text class="field" x="28" y="229">contrasena VARCHAR(100)</text><text class="meta" x="300" y="229">bcrypt hash</text>
    <text class="field" x="28" y="268">rol ENUM</text>
    <text class="field" x="28" y="307">activo BOOLEAN</text>
    <text class="field" x="28" y="346">createdAt DATETIME</text>
    <text class="field" x="28" y="385">updatedAt DATETIME</text>
    <text class="meta" x="28" y="438">Un usuario registra cero o muchas situaciones.</text>
  </g>

  <g transform="translate(555 170)">
    <rect class="entity" width="420" height="590" rx="16"/>
    <path class="head-case" d="M16 0h388a16 16 0 0 1 16 16v54H0V16A16 16 0 0 1 16 0z"/>
    <text class="head-text" x="26" y="43">SITUACIONES</text>
    <text class="field" x="28" y="112">🔑  id INT</text><text class="meta" x="328" y="112">PK, AI</text>
    <text class="field" x="28" y="151">tipo VARCHAR(80)</text>
    <text class="field" x="28" y="190">fecha DATE</text>
    <text class="field" x="28" y="229">lugar VARCHAR(200), NULL</text>
    <text class="field" x="28" y="268">descripcion TEXT</text>
    <text class="field" x="28" y="307">prioridad ENUM</text>
    <text class="field" x="28" y="346">estado ENUM</text>
    <text class="field" x="28" y="385">seguimiento TEXT</text>
    <text class="field" x="28" y="424">usuarioId INT</text><text class="meta" x="328" y="424">FK</text>
    <text class="field" x="28" y="463">createdAt DATETIME</text>
    <text class="field" x="28" y="502">updatedAt DATETIME</text>
    <text class="meta" x="28" y="556">FK usuarioId → usuarios.id · ON DELETE CASCADE</text>
  </g>

  <g transform="translate(1090 170)">
    <rect class="entity" width="350" height="510" rx="16"/>
    <path class="head-op" d="M16 0h318a16 16 0 0 1 16 16v54H0V16A16 16 0 0 1 16 0z"/>
    <text class="head-text" x="26" y="43">OPORTUNIDADES</text>
    <text class="field" x="24" y="112">🔑  id INT</text><text class="meta" x="285" y="112">PK, AI</text>
    <text class="field" x="24" y="151">etiqueta VARCHAR(80)</text>
    <text class="field" x="24" y="190">color VARCHAR(20)</text>
    <text class="field" x="24" y="229">titulo VARCHAR(180)</text><text class="meta" x="285" y="229">UNIQUE</text>
    <text class="field" x="24" y="268">texto TEXT</text>
    <text class="field" x="24" y="307">fecha VARCHAR(120), NULL</text>
    <text class="field" x="24" y="346">url VARCHAR(2048), NULL</text>
    <text class="field" x="24" y="385">enlace_texto VARCHAR(120)</text>
    <text class="field" x="24" y="424">informacion_url VARCHAR(2048)</text>
    <text class="field" x="24" y="463">activo BOOLEAN · orden INT</text>
  </g>

  <path class="line" d="M465 400H555"/>
  <text class="cardinality" x="477" y="386">1</text>
  <text class="cardinality" x="534" y="386">N</text>
  <text class="subtitle" x="466" y="433">registra</text>

  <g transform="translate(75 710)">
    <rect class="note" width="1365" height="120" rx="14"/>
    <text class="note-text" x="26" y="38">Claves y reglas</text>
    <text class="note-text" x="26" y="68">PK: clave primaria · FK: clave foránea · AI: autoincremento · correo y titulo son únicos.</text>
    <text class="note-text" x="26" y="96">La contraseña se almacena como hash bcrypt; nunca se guarda en texto plano. Oportunidades no tiene relación con situaciones.</text>
  </g>
</svg>
